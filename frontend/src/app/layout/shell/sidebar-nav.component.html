<div class="mb-6 flex items-center gap-3 px-2 pt-2">
  <span
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-primary text-lg font-extrabold text-white shadow-lg shadow-primary/30"
    >S</span
  >
  <div class="min-w-0">
    <p class="font-extrabold text-gray-900">StyloFlow{{ platform() ? ' · Plataforma' : '' }}</p>
    @if (!platform()) {
      <p class="truncate text-xs font-semibold text-gray-500">{{ businessName() }}</p>
    }
  </div>
</div>

<nav class="flex min-h-0 flex-1 flex-col gap-1 overflow-y-auto" aria-label="Principal">
  @for (item of items(); track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-white/90 !text-primary shadow-md"
      class="flex items-center gap-3 rounded-2xl px-4 py-3 text-[15px] font-semibold text-gray-500 transition-colors hover:bg-white/60 focus-visible:ring-2 focus-visible:ring-primary/70 focus-visible:outline-none"
      (click)="navigated.emit()"
    >
      <app-ui-icon [name]="item.icon" class="h-[18px] w-[18px]" />
      {{ item.label }}
    </a>
  }
</nav>

<div class="mt-4 space-y-1 border-t border-gray-900/[0.06] pt-4">
  @if (platform()) {
    <p class="px-4 pb-2 text-sm font-bold text-gray-900">{{ platformName() }}</p>
  } @else if (user(); as u) {
    <div class="mb-2 flex items-center gap-3 rounded-2xl bg-white/50 p-3">
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-xs font-bold text-primary"
        >{{ initials(u.name) }}</span
      >
      <div class="min-w-0">
        <p class="truncate text-sm font-bold text-gray-900">{{ u.name }}</p>
        <app-badge
          [label]="roleLabels[u.role].label"
          [tone]="roleLabels[u.role].tone"
          [dot]="false"
        />
      </div>
    </div>
    <button
      type="button"
      class="flex w-full cursor-pointer items-center gap-3 rounded-2xl px-4 py-2.5 text-sm font-semibold text-gray-500 hover:bg-white/60 hover:text-gray-800 focus-visible:ring-2 focus-visible:ring-primary/70 focus-visible:outline-none"
      (click)="changePassword()"
    >
      <app-ui-icon name="key" class="h-[18px] w-[18px]" /> Cambiar contraseña
    </button>
  }
  <button
    type="button"
    class="flex w-full cursor-pointer items-center gap-3 rounded-2xl px-4 py-2.5 text-sm font-semibold text-gray-500 hover:bg-white/60 hover:text-red-600 focus-visible:ring-2 focus-visible:ring-primary/70 focus-visible:outline-none"
    (click)="logout()"
  >
    <app-ui-icon name="logout" class="h-[18px] w-[18px]" /> Cerrar sesión
  </button>
</div>
