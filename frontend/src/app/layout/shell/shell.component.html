<div
  class="relative flex h-dvh overflow-clip bg-gradient-to-b from-[#f7eeee] via-[#faf6f5] to-[#f6efee]"
>
  <div class="bg-blob -top-56 -left-28 h-[560px] w-[560px] bg-primary/20"></div>
  <div class="bg-blob top-16 -right-40 h-[520px] w-[520px] bg-secondary/[0.22]"></div>
  <div class="bg-blob -bottom-52 left-1/3 h-[460px] w-[460px] bg-tertiary/[0.13]"></div>

  <div class="relative z-10 mx-auto flex h-full w-full max-w-[1680px] min-w-0">
    <app-sidebar-nav
      class="glass-panel m-4 mr-0 hidden w-72 shrink-0 rounded-3xl lg:flex"
      [platform]="platform()"
    />

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="glass-panel mx-4 mt-4 flex items-center gap-3 rounded-2xl px-4 py-3 lg:hidden">
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary font-extrabold text-white shadow-lg shadow-primary/30"
          >S</span
        >
        <span class="min-w-0 flex-1 truncate font-extrabold text-gray-900">{{
          pageTitle() || 'StyloFlow'
        }}</span>
        <button
          type="button"
          class="btn-icon"
          aria-label="Abrir menú"
          [attr.aria-expanded]="menuOpen()"
          (click)="menuOpen.set(true)"
        >
          <app-ui-icon name="menu" class="h-5 w-5" />
        </button>
      </header>
      <main class="flex min-h-0 flex-1 flex-col overflow-y-auto p-4 lg:p-8">
        <router-outlet />
      </main>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="glass-backdrop fixed inset-0 z-40 lg:hidden" (click)="closeMenu()"></div>
    <app-sidebar-nav
      class="glass-panel fixed inset-y-4 left-4 z-50 flex w-72 max-w-[calc(100vw-2rem)] rounded-3xl lg:hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Menú"
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      [platform]="platform()"
      (navigated)="closeMenu()"
      (keydown.escape)="closeMenu()"
    />
  }
</div>
