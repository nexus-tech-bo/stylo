<app-dialog-frame title="Cambiar contraseña" (closed)="ref.close()">
  <form id="password-form" [formGroup]="form" (ngSubmit)="save()" class="space-y-4" novalidate>
    @if (error()) {
      <p class="form-banner" role="alert">{{ error() }}</p>
    }
    <div>
      <label class="field-label" for="new-password">Nueva contraseña *</label>
      <div class="relative">
        <input
          id="new-password"
          cdkFocusInitial
          class="field-input pr-12"
          [type]="visible() ? 'text' : 'password'"
          autocomplete="new-password"
          maxlength="72"
          formControlName="password"
        />
        <button
          type="button"
          class="btn-icon absolute top-1/2 right-1.5 -translate-y-1/2"
          aria-label="Mostrar contraseña"
          [attr.aria-pressed]="visible()"
          (click)="visible.set(!visible())"
        >
          <app-ui-icon [name]="visible() ? 'eyeOff' : 'eye'" class="h-4 w-4" />
        </button>
      </div>
      <p class="field-hint">Entre 6 y 72 caracteres.</p>
      <app-field-error [control]="form.controls.password" />
    </div>
    <div>
      <label class="field-label" for="confirm-password">Confirmar contraseña *</label>
      <input
        id="confirm-password"
        class="field-input"
        [type]="visible() ? 'text' : 'password'"
        autocomplete="new-password"
        maxlength="72"
        formControlName="confirm"
      />
      <app-field-error [control]="form.controls.confirm" />
    </div>
  </form>
  <div dialogFooter class="contents">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">Cancelar</button>
    <button type="submit" form="password-form" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : 'Cambiar contraseña' }}
    </button>
  </div>
</app-dialog-frame>
