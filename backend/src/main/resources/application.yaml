server:
  port: 8085

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: styloflow
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Only the public schema is migrated by Spring Boot; tenant schemas are migrated by SchemaProvisioningService.
    locations: classpath:db/migration/public
    baseline-on-migrate: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS:12}

cloudinary:
  url: ${CLOUDINARY_URL:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Seeds superadmin/superadmin123 and demo/admin/admin123 (DevDataSeeder). Local dev only.
  seed-dev-data: ${SEED_DEV_DATA:false}

logging:
  level:
    # TRACE logs every bound parameter (password hashes, PII): opt-in for local dev only.
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:INFO}
